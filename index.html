<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Portfolio</title>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<style>
:root {
  --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
  --glass-bg: rgba(255, 255, 255, 0.04);
  --glass-bg-hover: rgba(255, 255, 255, 0.12);
  --glass-bg-active: rgba(99, 102, 241, 0.25);
  --glass-border: rgba(255, 255, 255, 0.08);
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-color: #6366f1;
  --accent-glow: rgba(99, 102, 241, 0.4);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Inter', 'Segoe UI', sans-serif;
}

body{
  background: var(--bg-gradient);
  color: var(--text-main);
  min-height:100vh;
  overflow-x: hidden;
}

/* BACKGROUND LAYOUT GLOW AMBIENT */
body::before, body::after {
  content: "";
  position: absolute;
  width: 300px;
  height: 300px;
  border-radius: 50%;
  background: var(--accent-glow);
  filter: blur(120px);
  z-index: -1;
  pointer-events: none;
}
body::before { top: 15%; left: 10%; }
body::after { bottom: 15%; right: 10%; background: rgba(219, 39, 119, 0.2); }

/* BAR NAVIGASI GLASSMORPHISM UTAMA */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:18px 40px;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--glass-border);
  position:sticky;
  top:0;
  z-index:1000;
}

.logo{
  color: var(--text-main);
  font-weight: 800;
  font-size: 22px;
  letter-spacing: -0.5px;
  background: linear-gradient(to right, #ffffff, #a5b4fc);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.menu{
  display:flex;
  flex-direction: row !important;
  position: static !important;
  width: auto !important;
  background: transparent !important;
  padding: 0 !important;
  box-shadow: none !important;
  gap:8px;
}

.menu button{
  padding: 10px 18px;
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  background: var(--glass-bg);
  color: var(--text-muted);
  font-size: 14px;
  font-weight: 500;
  cursor:pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.menu button:hover{
  background: var(--glass-bg-hover);
  color: var(--text-main);
  border-color: rgba(255, 255, 255, 0.2);
  transform: translateY(-1px);
}

.menu button.active{
  background: var(--glass-bg-active);
  color: #fff;
  border-color: var(--accent-color);
  box-shadow: 0 0 15px var(--accent-glow);
  font-weight: 600;
}

/* TOMBOL HAMBURGER MOBILE */
.hamburger{
  display:none;
  flex-direction:column;
  cursor:pointer;
  padding: 5px;
}

.hamburger div{
  width:24px;
  height:2px;
  background: var(--text-main);
  margin:4px 0;
  transition: 0.3s;
  border-radius: 2px;
}

/* CONTAINER KONTEN UTAMA DOCKING AJAX */
#content{
  max-width:960px;
  margin: 40px auto;
  background: rgba(30, 41, 59, 0.4);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--glass-border);
  padding: 40px;
  border-radius: 24px;
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
  min-height: 400px;
  animation: fade 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes fade{
  from{opacity:0; transform:translateY(16px);}
  to{opacity:1; transform:translateY(0);}
}

@keyframes pulse {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

/* CONFIG RESPONSIVE: KHUSUS TAMPILAN SMARTPHONE & TABLET LAYOUT CARD 2 COLUMN */
@media(max-width:992px){
  .navbar { padding: 15px 20px; }
  
  .menu{
    display: none !important;
    flex-direction: column !important;
    position: absolute !important;
    top: 100%;
    left:0;
    width:100% !important;
    background: rgba(15, 23, 42, 0.95) !important;
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    padding: 20px !important;
    gap: 10px;
    border-bottom: 1px solid var(--glass-border);
    box-shadow: 0 15px 30px rgba(0,0,0,0.5);
  }

  .menu.show{
    display:flex !important;
  }

  .menu button{
    width:100%;
    padding: 12px;
  }

  .hamburger{
    display:flex;
  }
}

button:active{
  transform:scale(0.98);
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<div class="navbar">
  <div class="logo">Ahmad Fauzi.</div>

  <div class="hamburger" id="hamburger">
    <div></div>
    <div></div>
    <div></div>
  </div>

  <div class="menu" id="menu">
    <button id="homeBtn" class="active">Home</button>
    <button id="aboutBtn">About</button>
    <button id="contactBtn">Contact</button>
    <button id="githubBtn">GitHub</button>
    <button id="skillsBtn">Skills</button>
    <button id="eduBtn">Educations</button>
    <button id="expBtn">Experiences</button>
    <button id="portBtn">Portfolio</button>
    <button id="smartBtn">Smart Campus</button>
    <button id="certBtn">Certificates</button>
  </div>
</div>

<div id="content">
  <div style="text-align:center; padding: 40px 0;">
    <h2 style="font-weight: 700; margin-bottom: 8px; letter-spacing: -0.5px;">Welcome</h2>
    <p style="color: var(--text-muted); font-size: 15px;">Silakan pilih menu di atas untuk menjelajahi CV</p>
  </div>
</div>

<script src="app.js"></script>

</body>
</html>
